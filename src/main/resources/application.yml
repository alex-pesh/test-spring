#debug: true
spring:
  application:
    name: "tes-spting"
  h2:
    console:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/test-spring
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgres
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQL95Dialect
        hbm2ddl.auto: none
        show_sql: false
        format_sql: true
        proc:
          param_null_passing: true
    show-sql: false

server:
  port: 8080
  error:
    include-message: always
