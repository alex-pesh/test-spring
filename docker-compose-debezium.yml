version: '2.4'

services:

  test-spring-db-dbz:
    container_name: test-spring-db-dbz
    image: postgres:${POSTGRES_VERSION}
    hostname: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./postgresql.conf:/etc/postgresql.conf
#      - ./data/pg-data/data_dbz:/var/lib/postgresql/data
      - ./data/pg-data/data:/var/lib/postgresql/data
      - ./data/pg-data/data/indexes:/var/lib/postgresql/data/indexes
    command: ["-c", "config_file=/etc/postgresql.conf"]
#    command: ['postgres', '-c', 'wal_level=logical']
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: test-spring

    restart: always
    healthcheck:
      test: pg_isready -U postgres
      interval: 10s
      timeout: 5s
      retries: 5


  test-spring-dbz:
    container_name: test-spring-dbz-pg
    image: debezium-postgres
    hostname: kafka1
    ports:
      - "9092:9092"
      - "29092:29092"
    volumes:
      - ${DB_MOUNT_LOCATION:-./data/pg-data/data_dbz}:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: test-spring

      KAFKA_BROKER_ID: 1
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:19092,EXTERNAL://${DOCKER_HOST_IP:-127.0.0.1}:9092,DOCKER://host.docker.internal:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LOG4J_LOGGERS: "kafka.controller=INFO,kafka.producer.async.DefaultEventHandler=INFO,state.change.logger=INFO"
      KAFKA_AUTHORIZER_CLASS_NAME: kafka.security.authorizer.AclAuthorizer
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "true"

    restart: always
    depends_on:
      - test-spring-db-dbz