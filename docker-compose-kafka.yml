version: '2.4'

services:

  kafka_1:
    image: apache/kafka:${KAFKA_VERSION}
    hostname: kafka_1
    container_name: kafka_1
    ports:
      - '29092:29092'
      - '9092:9092'
      - '9101:9101'
    volumes:
      - ./data/kafka/kafka-logs:/tmp/kafka-logs
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_controller.quorum.bootstrap.servers: kafka_1:29092
      KAFKA_controller.quorum.voters: 1@kafka_1:29092
      KAFKA_controller.listener.names: INTERNAL
      KAFKA_LISTENERS: INTERNAL://kafka_1:29092,DOCKER://kafka_1:39092,EXTERNAL://kafka_1:9092  # https://www.confluent.io/blog/kafka-listeners-explained/
      KAFKA_ADVERTISED_LISTENERS: DOCKER://kafka_1:9092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: EXTERNAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost
    healthcheck:
      test: nc -z localhost 9092 || exit -1
      start_period: 15s
      interval: 5s
      timeout: 10s
      retries: 10


  kui:
    container_name: kafka-ui
    image: provectuslabs/kafka-ui:v0.7.2
    ports:
      - 8090:8080
    environment:
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka_1:39092
      DYNAMIC_CONFIG_ENABLED: true
    volumes:
      - ./data/kafka/kui/config.yml:/etc/kafkaui/dynamic_config.yaml
